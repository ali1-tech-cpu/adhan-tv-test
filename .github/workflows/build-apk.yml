name: Build Adhan TV Test APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get uploaded project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 35 build tools
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: Extract original project ZIP
        run: unzip -oq AdhanTVTest-source.zip

      - name: Build installable test APK
        run: gradle --no-daemon -p AdhanTVTest :app:assembleDebug

      - name: Make APK available for download
        uses: actions/upload-artifact@v4
        with:
          name: AdhanTVTest-APK
          path: AdhanTVTest/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
