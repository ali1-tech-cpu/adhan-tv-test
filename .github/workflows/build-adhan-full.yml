name: Build Adhan TV Full APK

on:
  push:
    paths:
      - 'AdhanTVFull-source.zip'
      - '.github/workflows/build-adhan-full.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK platform
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: Unpack full version source
        run: unzip -oq AdhanTVFull-source.zip

      - name: Build APK
        run: gradle --no-daemon -p AdhanTVFull :app:assembleDebug

      - name: Attach APK to successful run
        uses: actions/upload-artifact@v4
        with:
          name: AdhanTVFull-APK
          path: AdhanTVFull/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
