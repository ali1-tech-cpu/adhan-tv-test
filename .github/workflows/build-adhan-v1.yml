name: Build Adhan TV 1.0 APK

on:
  push:
    paths:
      - 'AdhanTVRelease-source.zip'
      - '.github/workflows/build-adhan-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform and build tools
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: Extract the new source
        run: unzip -oq AdhanTVRelease-source.zip

      - name: Download CC0 adhan recording and verify original checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p AdhanTVRelease/app/src/main/res/raw
          curl --fail --location --retry 4 --retry-delay 3 \
            --connect-timeout 30 --max-time 180 \
            -A 'AdhanTV-personal-noncommercial-app/1.0' \
            'https://upload.wikimedia.org/wikipedia/commons/b/b0/Beautiful_adhan.ogg' \
            -o AdhanTVRelease/app/src/main/res/raw/adhan.ogg
          echo 'a1fa4fd942401922c5c3301816384aae86956522  AdhanTVRelease/app/src/main/res/raw/adhan.ogg' | sha1sum -c -

      - name: Build signed personal-installation APK
        run: gradle --no-daemon -p AdhanTVRelease :app:assembleDebug

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AdhanTV-v1-APK
          path: AdhanTVRelease/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
